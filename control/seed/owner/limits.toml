# 主人定的上限（只有主人改；agent 改不了）。删掉某个键就用它的默认值。

[lab]
seconds_per_run = 1800      # 一次 Lab 运行最长秒数

[meta]
calls_per_round = 8         # 一轮 Meta 最多调用几次
trials_per_round = 4        # 一轮 Meta 最多试跑几次
seconds_per_call = 900      # 一次 Meta 调用最长秒数

[day]
calls = 60                  # 每天最多开始几次调用
tokens = 0                  # 每天最多用多少 token；0 表示不设上限
