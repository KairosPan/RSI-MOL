# The owner's limits (only the owner changes them; agents cannot). A key that is left out takes its default value.

[lab]
seconds_per_run = 1800      # longest Lab run, in seconds

[meta]
calls_per_round = 8         # most Meta calls in one round
trials_per_round = 4        # most trial runs in one Meta round
seconds_per_call = 900      # longest Meta call, in seconds

[day]
calls = 60                  # most calls started in one day
tokens = 0                  # most tokens used in one day; 0 means no limit
