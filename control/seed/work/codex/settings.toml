# Lab Codex 的设置。控制程序每次启动 Lab 前，把这里写的键合成进 Codex 的配置。
# 只认下面这些键；写了别的键不生效，会记在那次运行的记录里。不写的键用默认值。
# 下面的例子都注释掉了，要用哪个，就去掉那几行开头的 "# "，再改成你要的值。

# 模型名。不写就用 Codex 的默认模型。
# model = "<模型名>"

# 推理强度：none、minimal、low、medium、high、xhigh 之一。不写就用 Codex 的默认值。
# model_reasoning_effort = "high"

# 网页搜索：live（实时搜）、cached（用缓存的结果）、disabled（关掉）之一。不写就用 Codex 的默认值。
# web_search = "live"

# 命令联网：true 打开，false 关闭（默认关闭）。打开后命令经网络代理连外网，这台 Mac 上的本地服务仍然连不上。
# network = true

# 子 agent：max_depth 是最多套几层（1 到 3，默认 1，即子 agent 不再派子 agent），
# max_threads 是同时最多开几个（1 到 8，默认 3）。
# [agents]
# max_depth = 2
# max_threads = 4

# 在已允许的连接器和插件里关掉某几个，写它们的编号。
# [disable]
# connectors = ["<连接器编号>"]
# plugins = ["<插件编号>"]

# 本地工具服务，名字写在 tool_servers. 后面（字母、数字、_ 和 -，不能含 codex）。代码放在 tools/<名字>/。
# command 是要运行的程序，args 是参数（工作区里的文件写相对路径），network 是它要不要联网（默认 false）。
# 它和 Lab 的命令在同一个沙箱里启动。
# [tool_servers.local_tool]
# command = "python3"
# args = ["tools/local_tool/server.py"]
# network = true

# 按网址连接的工具服务：url 只能是 https 加域名，不能指向这台 Mac 或局域网。
# 要密钥的话，bearer_token_env_var 写环境变量的名字（以 RSI_TOOL_ 开头）；这个密钥能发给哪个域名由主人定。
# [tool_servers.web_tool]
# url = "https://example.com/mcp"
# bearer_token_env_var = "RSI_TOOL_WEB"
