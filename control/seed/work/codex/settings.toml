# Settings of the Lab's Codex. Each time before it starts the Lab, the control program merges the keys written here
# into Codex's configuration.
# Only the keys below are accepted; any other key has no effect and is noted in the record of that run. A key that is
# not written keeps its default value.
# The examples below are all commented out. To use one, remove the "# " at the start of its lines, then change the
# values to the ones you want.

# The model name. If it is not written, Codex's default model is used.
# model = "<model name>"

# Reasoning effort: one of none, minimal, low, medium, high, xhigh. If it is not written, Codex's default is used.
# model_reasoning_effort = "high"

# Web search: one of live (search live), cached (use cached results), disabled (turned off). If it is not written,
# Codex's default is used.
# web_search = "live"

# Network for commands: true turns it on, false turns it off (off by default). When it is on, commands reach outside
# networks through a network proxy; local services on this Mac still cannot be reached.
# network = true

# Sub-agents: max_depth is how many levels deep they may nest (1 to 3, default 1, that is, a sub-agent dispatches no
# further sub-agents), and max_threads is how many may run at once (1 to 8, default 3).
# [agents]
# max_depth = 2
# max_threads = 4

# To turn off some of the allowed connectors and plugins, write their ids. The Lab cannot see these ids itself; Meta
# can read them in the run records.
# [disable]
# connectors = ["<connector id>"]
# plugins = ["<plugin id>"]

# A local tool server: write its name after "tool_servers." (letters, digits, _ and -; it may not contain codex). Its
# code goes in tools/<name>/.
# command is the program to run, args are its arguments (give files in the workspace as relative paths), and network
# is whether it uses the network (default false).
# It is started in the same sandbox as the Lab's commands.
# [tool_servers.local_tool]
# command = "python3"
# args = ["tools/local_tool/server.py"]
# network = true

# A tool server reached at a URL: url must be https with a domain name, and may not point to this Mac or the local
# network.
# If it needs a key, write in bearer_token_env_var the name of the environment variable that holds it (starting with
# RSI_TOOL_); the owner decides which domain the key may be sent to.
# [tool_servers.web_tool]
# url = "https://example.com/mcp"
# bearer_token_env_var = "RSI_TOOL_WEB"
